<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proyectos — Jaime Gaming</title>
<meta name="description" content="Repositorios públicos de Jaime Gaming y PineappleVA, sincronizados desde GitHub." />
<meta name="author" content="Jaime Gaming" />
<meta name="theme-color" content="#10120f" />
<!-- JG source mark: Jaime Gaming / jaime-gaming.github.io -->
<link rel="canonical" href="https://jaime-gaming.github.io/projects/" />
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

<a class="skip-link" href="#top" data-i18n="aria.skipToContent">Saltar al contenido</a>
<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<header class="nav">
  <a href="/" class="nav__logo" aria-label="Jaime Gaming — inicio" data-i18n-aria="aria.homeLogo">JG<span class="dot">.</span></a>
  <nav class="nav__links" aria-label="Navegación principal" data-i18n-aria="aria.mainNav">
    <a href="/" data-i18n="nav.home" class="">Inicio</a>
    <a href="/projects/" data-i18n="nav.projects" class="active">Proyectos</a>
    <a href="/blog/" data-i18n="nav.blog" class="">Blog</a>
    <a href="/#contact" data-i18n="nav.contact" class="">Contacto</a>
  </nav>
  <div class="nav__actions">
    <button class="lang-switch" id="langSwitch" type="button" aria-label="Cambiar idioma" data-i18n-aria="aria.langSwitch">
      <span data-lang="es">ES</span>/<span data-lang="en">EN</span>
    </button>
    <button class="burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobileMenu" data-i18n-aria="nav.openMenu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="mobile-menu" id="mobileMenu" aria-label="Navegación móvil" data-i18n-aria="aria.mainNav">
  <a href="/" data-i18n="nav.home">Inicio</a>
  <a href="/projects/" data-i18n="nav.projects">Proyectos</a>
  <a href="/blog/" data-i18n="nav.blog">Blog</a>
  <a href="/#contact" data-i18n="nav.contact">Contacto</a>
</nav>

<main id="top">
  <section class="section section--wide projects-page">
    <div class="section__head reveal">
      <span class="section__num">/PROJECTS</span>
      <h1 class="section__title" data-i18n="projectsPage.title">Proyectos</h1>
      <p class="section__sub" data-i18n="projectsPage.sub">Repositorios públicos de Jaime Gaming y PineappleVA.</p>
    </div>
    <div class="github__toolbar reveal">
      <div class="github__sync" id="githubSync" data-state="loading" aria-live="polite" aria-atomic="true">
        <span class="github__sync-dot" aria-hidden="true"></span>
        <span class="github__sync-copy">
          <span class="github__sync-label" id="githubSyncLabel" data-i18n="github.syncLoading">Conectando con GitHub…</span>
          <time class="github__sync-time" id="githubSyncTime"></time>
        </span>
      </div>
      <button class="sync-button" id="githubRefresh" type="button" aria-label="Actualizar datos de GitHub" data-i18n-aria="github.refreshAria">
        <svg class="sync-button__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" /></svg>
        <span data-i18n="github.refresh">Actualizar</span>
      </button>
    </div>
    <div class="projects__grid projects__grid--full" id="projectsGrid" aria-busy="true">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>© <span id="year"></span> Jaime Gaming.</p>
  <button class="to-top" id="toTop" type="button" aria-label="Volver arriba" data-i18n-aria="aria.backToTop">↑</button>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
