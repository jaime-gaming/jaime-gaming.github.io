<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proyectos — Jaime Gaming</title>
<meta name="description" content="Todos los repositorios públicos de Jaime Gaming, sincronizados en vivo desde GitHub." />
<meta name="theme-color" content="#0b0b0c" />
<link rel="canonical" href="https://jaime-gaming.github.io/projects/" />
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<header class="nav">
  <a href="/" class="nav__logo">JG<span class="dot">.</span></a>
  <nav class="nav__links" aria-label="Main navigation">
    <a href="/" data-i18n="nav.home" class="">Home</a>
    <a href="/projects/" data-i18n="nav.projects" class="active">Projects</a>
    <a href="/blog/" data-i18n="nav.blog" class="">Blog</a>
    <a href="/#contact" data-i18n="nav.contact" class="">Contact</a>
  </nav>
  <div class="nav__actions">
    <button class="lang-switch" id="langSwitch" type="button" aria-label="Switch language" data-i18n-aria="aria.langSwitch">
      <span data-lang="es">ES</span>/<span data-lang="en">EN</span>
    </button>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="/" data-i18n="nav.home">Home</a>
  <a href="/projects/" data-i18n="nav.projects">Projects</a>
  <a href="/blog/" data-i18n="nav.blog">Blog</a>
  <a href="/#contact" data-i18n="nav.contact">Contact</a>
</div>

<main id="top">
  <section class="section section--wide">
    <div class="section__head reveal">
      <span class="section__num">/projects</span>
      <h2 class="section__title" data-i18n="projects.title">Proyectos</h2>
      <p class="section__sub" data-i18n="projects.sub">Todos mis repositorios públicos, sincronizados en vivo desde GitHub. Cada uno tiene su propia página.</p>
    </div>
    <div class="projects__grid" id="projectsGrid">
      <div class="skeleton-card reveal"></div>
      <div class="skeleton-card reveal"></div>
      <div class="skeleton-card reveal"></div>
      <div class="skeleton-card reveal"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>© <span id="year"></span> Jaime Gaming. <span data-i18n="footer.made">Hecho con curiosidad y código.</span></p>
  <button class="to-top" id="toTop" aria-label="Back to top" data-i18n-aria="aria.backToTop">↑</button>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
