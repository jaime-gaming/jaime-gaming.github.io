<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — Jaime Gaming</title>

<meta name="theme-color" content="#0b0b0c" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="/assets/css/style.css" />

<body>

<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<header class="nav">
  <a href="/" class="nav__logo">JG<span class="dot">.</span></a>
  <nav class="nav__links" aria-label="Main navigation">
    <a href="/" data-i18n="nav.home" class="">Home</a>
    <a href="/projects/" data-i18n="nav.projects" class="">Projects</a>

  <div class="nav__actions">
    <button class="lang-switch" id="langSwitch" type="button" aria-label="Switch language" data-i18n-aria="aria.langSwitch">
      <span data-lang="es">ES</span>/<span data-lang="en">EN</span>

    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">

    </button>

  <a href="/" data-i18n="nav.home">Home</a>

    <div class="section__head reveal">
      <span class="section__num">/blog</span>
      <h2 class="section__title" data-i18n="blog.title">Blog</h2>

    </div>
    <div class="blog__list">
      <a class="blog-item reveal" href="/blog/bienvenido/">

        <h3 class="blog-item__title">Bienvenido a mi blog</h3>
        <p class="blog-item__excerpt">El primer post de mi nuevo blog, dentro de mi portfolio rediseñado.</p>
      </a>

  </section>

<footer class="footer">
  <p>© <span id="year"></span> Jaime Gaming. <span data-i18n="footer.made">Hecho con curiosidad y código.</span></p>
  <button class="to-top" id="toTop" aria-label="Back to top" data-i18n-aria="aria.backToTop">↑</button>
</footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/main.js"></script>
